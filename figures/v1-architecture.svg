<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker>
  <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1f5aa6"/></marker>
  <style>
    text{font-family:'Times New Roman',Times,serif}
    .title{font-size:34px;font-weight:700}
    .label{font-size:22px;font-weight:700}
    .small{font-size:18px;font-weight:400}
    .box{fill:#fff;stroke:#222;stroke-width:2}
    .rd{fill:#f5f9ff;stroke:#1f5aa6;stroke-width:2.3}
    .line{fill:none;stroke:#222;stroke-width:2.3;marker-end:url(#arrow)}
    .bline{fill:none;stroke:#1f5aa6;stroke-width:2.4;marker-end:url(#blue)}
  </style>
</defs>
<rect width="1200" height="860" fill="white"/>
<text x="600" y="48" text-anchor="middle" class="title">FEMU Read-Disturbance V1 Architecture</text>

<rect x="430" y="80" width="340" height="58" rx="8" class="box"/>
<text x="600" y="117" text-anchor="middle" class="label">Host READ</text>
<path d="M600 138V165" class="line"/>

<rect x="430" y="167" width="340" height="58" rx="8" class="box"/>
<text x="600" y="204" text-anchor="middle" class="label">LPN to PPA</text>
<path d="M600 225V252" class="line"/>

<rect x="405" y="254" width="390" height="58" rx="8" class="box"/>
<text x="600" y="291" text-anchor="middle" class="label">Physical NAND Block</text>
<path d="M600 312V340" class="bline"/>

<rect x="430" y="342" width="340" height="62" rx="8" class="rd"/>
<text x="600" y="381" text-anchor="middle" class="label">Block read_cnt</text>

<path d="M600 404V440H320V468" class="bline"/>
<path d="M600 404V440H880V468" class="bline"/>

<rect x="120" y="470" width="400" height="72" rx="8" class="rd"/>
<text x="320" y="500" text-anchor="middle" class="label">RBER / ECC Check</text>
<text x="320" y="527" text-anchor="middle" class="small">retry when expected raw errors exceed ECC strength</text>
<path d="M320 542V575" class="bline"/>

<rect x="145" y="577" width="350" height="68" rx="8" class="rd"/>
<text x="320" y="607" text-anchor="middle" class="label">Read Retry</text>
<text x="320" y="633" text-anchor="middle" class="small">adds NAND page-read latency</text>

<rect x="680" y="470" width="400" height="72" rx="8" class="rd"/>
<text x="880" y="500" text-anchor="middle" class="label">Reclaim Threshold</text>
<text x="880" y="527" text-anchor="middle" class="small">reliability trigger from block read stress</text>
<path d="M880 542V575" class="bline"/>

<rect x="680" y="577" width="400" height="68" rx="8" class="rd"/>
<text x="880" y="607" text-anchor="middle" class="label">GC-backed Migration</text>
<text x="880" y="633" text-anchor="middle" class="small">copy valid pages, then erase old line</text>

<path d="M320 645V700H500" class="line"/>
<path d="M880 645V700H700" class="line"/>

<rect x="430" y="672" width="340" height="70" rx="8" class="box"/>
<text x="600" y="703" text-anchor="middle" class="label">Internal NAND Activity</text>
<text x="600" y="729" text-anchor="middle" class="small">retry reads, migration reads/writes, erase</text>
<path d="M600 742V772" class="line"/>

<rect x="390" y="774" width="420" height="64" rx="8" class="box"/>
<text x="600" y="803" text-anchor="middle" class="label">Host-visible Effect</text>
<text x="600" y="828" text-anchor="middle" class="small">retry latency and subsequent NAND-resource contention</text>
</svg>