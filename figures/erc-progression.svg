<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
<style>
text{font-family:'Times New Roman',Times,serif;fill:#111}.title{font-size:36px;font-weight:700}.axis{font-size:24px}.tick{font-size:20px}.legend{font-size:22px}.note{font-size:19px}.anno{font-size:21px}.line1{fill:none;stroke:#111;stroke-width:3}.line2{fill:none;stroke:#666;stroke-width:2.5;stroke-dasharray:10 6}.thr{fill:none;stroke:#333;stroke-width:2;stroke-dasharray:4 5}.grid{stroke:#d0d0d0;stroke-width:1}.axes{stroke:#111;stroke-width:2}</style>
<rect width="1200" height="760" fill="white"/>
<text x="600" y="52" text-anchor="middle" class="title">WL-level ERC under repeated reads to WL10</text>
