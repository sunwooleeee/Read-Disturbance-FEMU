<g class="tick" text-anchor="end"><text x="138" y="626">0</text><text x="138" y="541">400</text><text x="138" y="456">800</text><text x="138" y="371">1200</text><text x="138" y="286">1600</text><text x="138" y="201">2000</text><text x="138" y="116">2400</text></g>
<g class="tick" text-anchor="middle"><text x="150" y="650">0</text><text x="250" y="650">32</text><text x="350" y="650">64</text><text x="450" y="650">96</text><text x="550" y="650">128</text><text x="650" y="650">160</text><text x="750" y="650">192</text><text x="850" y="650">224</text><text x="950" y="650">256</text></g>
<text x="560" y="700" text-anchor="middle" class="axis">Repeated reads to WL10 (RC)</text><text x="50" y="365" text-anchor="middle" class="axis" transform="rotate(-90 50 365)">Effective Read Count (ERC)</text>
<path d="M150 620 L950 172" class="line1"/><path d="M150 620 L950 566.7" class="line2"/><line x1="150" y1="172.1" x2="970" y2="172.1" class="thr"/>
<circle cx="950" cy="172" r="6" fill="#111"/><circle cx="950" cy="566.7" r="6" fill="white" stroke="#666" stroke-width="2.5"/>
